[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roost"
version = "0.0.1"
description = "Durable, exactly-once agent sessions on disposable sandboxes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JerryChaox" }]
keywords = ["agent", "sandbox", "session", "runtime", "exactly-once"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

# 核心零运行时依赖是硬约束；云 backend 走 extra。
[project.optional-dependencies]
e2b = ["e2b>=2.39,<3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "e2b>=2.39,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/roost"]

[tool.hatch.build.targets.sdist]
include = ["src/roost", "README.md", "LICENSE", "DESIGN.md", "CONTRACTS.md", "PROTOCOL.md"]
