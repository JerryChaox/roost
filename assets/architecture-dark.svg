<text x="942" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#E6EDF3" text-anchor="start" letter-spacing="1">OPERATE · roost CLI</text>
<rect x="26" y="252" width="888" height="348" rx="16" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="46" y="242" width="405" height="20" fill="#0D1117"/>
