<text x="884" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9198A1" text-anchor="end">conversation API</text>
<path d="M685 104 V126" stroke="#9198A1" stroke-width="1.5"/><path d="M680 120 L685 128 L690 120" fill="none" stroke="#9198A1" stroke-width="1.5"/>
